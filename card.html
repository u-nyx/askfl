<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CBFM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #090b10;
      --bg-glow-1: rgba(56, 189, 248, 0.14);
      --bg-glow-2: rgba(168, 85, 247, 0.14);
      --card-bg: linear-gradient(155deg, rgba(22, 27, 38, 0.96), rgba(13, 16, 24, 0.98));
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --tag-bg: rgba(255, 255, 255, 0.05);
      --tag-border: rgba(255, 255, 255, 0.09);
      --link-bg: rgba(255, 255, 255, 0.04);
      --link-hover: rgba(56, 189, 248, 0.14);
      --strap-base: #0c0d10;
      --strap-edge: #27272a;
      --clasp-metal-1: #94a3b8;
      --clasp-metal-2: #334155;
      --holo-opacity: 0.28;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'IBM Plex Sans Thai', sans-serif;
      user-select: none;
      touch-action: none;
    }

    /* แสงฟุ้งพื้นหลัง */
    .ambient-bg {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 25% 20%, var(--bg-glow-1), transparent 45%),
        radial-gradient(circle at 75% 80%, var(--bg-glow-2), transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    /* พื้นหลังจุดที่เลื่อนและเปลี่ยนสี */
    @property --dot-h {
      syntax: '<number>';
      inherits: true;
      initial-value: 200;
    }

    .dot-layer {
      position: fixed;
      inset: -26px;
      background-image: radial-gradient(
        circle,
        hsla(var(--dot-h), 85%, 70%, 0.45) 1.2px,
        transparent 1.6px
      );
      background-size: 26px 26px;
      pointer-events: none;
      z-index: 0;
      will-change: transform;
      animation: dotDrift 14s linear infinite, dotHue 12s linear infinite;
    }

    @keyframes dotDrift {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(26px, 26px, 0); }
    }

    @keyframes dotHue {
      from { --dot-h: 0; }
      to   { --dot-h: 360; }
    }

    #lanyard-svg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      transform: translateZ(0);
    }

    .stage {
      position: fixed;
      inset: 0;
      perspective: 1100px;
      pointer-events: none;
      z-index: 20;
    }

    #card-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 340px;
      transform-style: preserve-3d;
      pointer-events: auto;
      cursor: grab;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    #card-wrapper:active {
      cursor: grabbing;
    }

    .clasp-assembly {
      position: relative;
      width: 38px;
      height: 44px;
      margin: 0 auto -11px auto;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    .strap-clamp-box {
      width: 22px;
      height: 14px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--clasp-metal-2), var(--clasp-metal-1), var(--clasp-metal-2));
      border: 1px solid var(--clasp-metal-1);
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      padding: 1px 3px;
      z-index: 2;
    }

    .strap-clamp-box span {
      display: block;
      height: 1.2px;
      background: rgba(15, 23, 42, 0.65);
      border-radius: 1px;
    }

    .clasp-loop {
      width: 14px;
      height: 10px;
      margin-top: -2px;
      border: 2.2px solid var(--clasp-metal-1);
      border-radius: 4px;
      background: #090b10;
    }

    .clasp-body {
      width: 11px;
      height: 13px;
      margin-top: -2px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--clasp-metal-2), var(--clasp-metal-1), var(--clasp-metal-2));
    }

    .clasp-hook {
      width: 8px;
      height: 12px;
      margin-top: -2px;
      border: 2px solid var(--clasp-metal-1);
      border-top: none;
      border-radius: 0 0 6px 6px;
    }

    .card-flipper {
      position: relative;
      width: 100%;
      height: 480px;
      transform-style: preserve-3d;
      will-change: transform;
      transform: translateZ(0);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .card-flipper.flipped {
      transform: rotateY(180deg) translateZ(0);
    }

    .id-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 18px 20px 20px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translateZ(0.1px);
      contain: layout paint;
    }

    .id-card.card-back {
      transform: rotateY(180deg) translateZ(0.1px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .back-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px 10px;
    }

    .card-slot-cutout {
      width: 44px;
      height: 8px;
      border-radius: 999px;
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      margin: 0 auto 14px auto;
      position: relative;
      z-index: 2;
    }

    .holo-foil {
      position: absolute;
      inset: -40%;
      background: linear-gradient(
        125deg,
        transparent 20%,
        rgba(56, 189, 248, 0.28) 38%,
        rgba(244, 114, 182, 0.3) 50%,
        rgba(250, 204, 21, 0.24) 62%,
        transparent 80%
      );
      opacity: var(--holo-opacity);
      pointer-events: none;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .specular-glare {
      position: absolute;
      inset: -35%;
      background: radial-gradient(
        circle at 50% 35%,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(255, 255, 255, 0.03) 35%,
        transparent 62%
      );
      pointer-events: none;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      position: relative;
      z-index: 2;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .avatar-wrap {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 18px;
      padding: 2px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover;
      background: #1e293b;
      display: block;
    }

    .verified-tick {
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .profile-info h1 {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 3px;
    }

    .profile-handle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .profile-role {
      font-size: 12.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .bio-text {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      position: relative;
      z-index: 2;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      padding: 4px 9px;
      border-radius: 8px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--text-primary);
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      position: relative;
      z-index: 2;
    }

    .bio-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 13px;
      border-radius: 12px;
      background: var(--link-bg);
      border: 1px solid var(--tag-border);
      color: var(--text-primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }

    .bio-link:hover {
      background: var(--link-hover);
      border-color: var(--accent);
    }

    .link-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .link-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .card-footer {
      padding-top: 12px;
      border-top: 1px dashed var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .barcode {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 20px;
      opacity: 0.65;
    }

    .barcode span {
      display: block;
      height: 100%;
      background: var(--text-primary);
    }

    .serial-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
    }

    .qr-placeholder {
      width: 120px;
      height: 120px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--text-primary);
    }

    .back-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .back-desc {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate3d(-50%, 80px, 0);
      background: var(--text-primary);
      color: var(--bg-color);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translate3d(-50%, 0, 0);
    }

    @media (max-width: 420px) {
      #card-wrapper {
        width: 312px;
      }
    }
  
    /* ---- แถบเครื่องมือ, ป๊อปอัป และข้อความแจ้งของหน้าการ์ด ---- */
    .cbfm-bar { position: fixed; top: 14px; right: 14px; z-index: 60; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 28px); }
    .cbfm-btn { font-family: 'IBM Plex Sans Thai', sans-serif; font-size: 12.5px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--card-border); background: rgba(22, 27, 38, 0.92); color: var(--text-primary); cursor: pointer; user-select: none; }
    .cbfm-btn:hover { border-color: var(--accent); }
    .cbfm-btn.primary { background: #3b62d8; border-color: #3b62d8; color: #fff; }
    .cbfm-btn:disabled { opacity: 0.5; cursor: default; }
    .cbfm-hidden { display: none !important; }
    .cbfm-notice { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--text-secondary); font-size: 15px; background: var(--bg-color); user-select: text; }
    .cbfm-modal { position: fixed; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.6); touch-action: auto; user-select: text; }
    .cbfm-form { width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; background: rgba(18, 22, 32, 0.98); border: 1px solid var(--card-border); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .cbfm-form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); }
    .cbfm-form input, .cbfm-form textarea { font-family: inherit; font-size: 13px; color: var(--text-primary); background: #0d1017; border: 1px solid var(--card-border); border-radius: 10px; padding: 8px 10px; }
    .cbfm-form .check { flex-direction: row; align-items: center; gap: 8px; color: var(--text-primary); }
    .cbfm-form .row { display: flex; justify-content: flex-end; gap: 8px; }
    .cbfm-msg { min-height: 16px; font-size: 12px; color: #f87171; }
    .cbfm-share { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-secondary); max-width: 90vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cbfm-chip { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 4px 9px; border-radius: 8px; background: var(--tag-bg); border: 1px solid var(--tag-border); color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="dot-layer"></div>

  <!-- Lanyard SVG Straps -->
  <svg id="lanyard-svg">
    <path id="strap-back-shadow" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="22" stroke-linecap="round"/>
    <path id="strap-back-outer" fill="none" stroke="var(--strap-edge)" stroke-width="20" stroke-linecap="round"/>
    <path id="strap-back-base" fill="none" stroke="var(--strap-base)" stroke-width="18" stroke-linecap="round"/>

    <path id="strap-front-shadow" fill="none" stroke="rgba(0,0,0,0.42)" stroke-width="22" stroke-linecap="round"/>
    <path id="strap-front-outer" fill="none" stroke="var(--strap-edge)" stroke-width="20" stroke-linecap="round"/>
    <path id="strap-front-base" fill="none" stroke="var(--strap-base)" stroke-width="18" stroke-linecap="round"/>
  </svg>

  <main class="stage">
    <div id="card-wrapper">
      <div class="clasp-assembly">
        <div class="strap-clamp-box">
          <span></span>
          <span></span>
        </div>
        <div class="clasp-loop"></div>
        <div class="clasp-body"></div>
        <div class="clasp-hook"></div>
      </div>

      <div class="card-flipper" id="card-flipper">

        <!-- FRONT SIDE -->
        <article class="id-card" id="id-card">
          <div class="holo-foil" id="holo-foil"></div>
          <div class="specular-glare" id="specular-glare"></div>

          <div class="card-slot-cutout"></div>

          <div class="card-meta">
            <span>PASS // CARD-ID</span>
            <span class="status-badge">
              <span class="status-dot"></span>
              <span>AVAILABLE</span>
            </span>
          </div>

          <div class="profile-header">
            <div class="avatar-wrap">
              <img
                class="avatar-img"
                src="pfuser.jpg"
                alt="Profile Avatar"
              />
              <span class="verified-tick" title="Verified">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 2L14.4 3.75C15.1 4.25 15.9 4.4 16.7 4.2L19.5 3.5L20.5 6.3C20.7 7.1 21.1 7.8 21.7 8.3L23.7 10.7L22.2 13.5C21.8 14.2 21.7 15 21.9 15.8L22.8 18.6L20 19.8C19.3 20.1 18.7 20.6 18.2 21.2L16.2 23.4L13.5 22.4C12.8 22.1 12 22.1 11.3 22.4L8.6 23.4L6.6 21.2C6.1 20.6 5.5 20.1 4.8 19.8L2 18.6L2.9 15.8C3.1 15 3 14.2 2.6 13.5L1.1 10.7L3.1 8.3C3.7 7.8 4.1 7.1 4.3 6.3L5.3 3.5L8.1 4.2C8.9 4.4 9.7 4.2 10.4 3.75L12 2Z" fill="#6aeb16"/>
                  <path d="M9.8 17.2L6.8 14.2L8.2 12.8L9.8 14.4L16.4 7.8L17.8 9.2L9.8 17.2Z" fill="#FFFFFF"/>
                </svg>
              </span>
            </div>

            <div class="profile-info">
              <h1>xpuise</h1>
              <div class="profile-handle">@xpuise.builds.dev</div>
              <div class="profile-role">Creative Developer &amp; UI Designer</div>
            </div>
          </div>

          <p class="bio-text">
            ออกแบบและพัฒนาเว็บแอปพลิเคชันแบบ Interactive ผสมผสานงานดีไซน์ที่ลื่นไหลเข้ากับโค้ดที่ใช้งานได้จริง
          </p>

          <div class="tags-row">
            <span class="tag">Frontend</span>
            <span class="tag">UI/UX</span>
            <span class="tag">IoT &amp; Web</span>
          </div>

          <div class="links-stack">
            <button class="bio-link" type="button" id="copy-email-btn">
              <span class="link-left">
                <span class="link-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                </span>
                <span>Contact Email</span>
              </span>
              <span class="link-sub" id="display-email">content.essencx@gmail.com</span>
            </button>

            <button class="bio-link" type="button" id="copy-discord-btn">
              <span class="link-left">
                <span class="link-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </span>
                <span>Discord / Social</span>
              </span>
              <span class="link-sub" id="display-discord">miioel</span>
            </button>

            <button class="bio-link" type="button" id="copy-instagram-btn">
              <span class="link-left">
                <span class="link-icon">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="
